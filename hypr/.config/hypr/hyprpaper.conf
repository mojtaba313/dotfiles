# ============================================
# hyprpaper — Abyss Cyan
# wallpapers ship as JPEG: the film grain that keeps them from looking flat
# costs ~600 KB as JPG vs ~17 MB as PNG.
# install.sh symlinks repo wallpapers/ into ~/Pictures/Wallpapers/
# ============================================

preload = ~/Pictures/Wallpapers/bg1.png
#prelaod = ~/Pictures/Wallpapers/2.webp
#preload = ~/Pictures/Wallpapers/3.jpeg

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/bg1.png
    fit_mode = cover
}

ipc = on
splash = false
