# ============================================
# hyprlock — Abyss Cyan
# SUPER+ESC to lock. Matches kitty/waybar palette.
# ============================================

general {
    disable_loading_bar = false
    hide_cursor = true
    no_fade_in = false
    grace = 5
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/abyss-cyan.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.3
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font Mono
    color = rgba(230, 251, 255, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A %d %B')"
    font_size = 20
    font_family = Inter, JetBrainsMono Nerd Font Mono
    color = rgba(0, 229, 255, 1.0)
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  type password to unlock
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    color = rgba(93, 116, 136, 1.0)
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 229, 255, 0.9)
    inner_color = rgba(6, 11, 17, 0.85)
    font_color = rgba(217, 232, 242, 1.0)
    fail_color = rgba(255, 107, 129, 0.9)
    check_color = rgba(61, 214, 140, 0.9)
    placeholder_text = <i>password…</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
