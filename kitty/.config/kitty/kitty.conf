# ============================================
# Kitty — Abyss Cyan
# Dark + cyan setup for long dev / study sessions
# font: JetBrainsMono Nerd Font (already on Arch)
# ============================================

allow_remote_control yes
listen_on unix:/tmp/kitty

# --- Font ---
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
adjust_line_height 110%
adjust_column_width 0
box_drawing_scale 1,1,2,2
disable_ligatures never

# --- Window / layout ---
window_padding_width 12
window_margin_width 0
window_border_width 1pt
window_gap 0
single_window_margin_width -1
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no
update_check_interval 0
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 8.0
mouse_hide_wait 3.0
copy_on_select yes
strip_trailing_spaces smart
open_url_with default
url_style curly
detect_urls yes
terminal_select_modifiers shift+ctrl

# --- Opacity / blur (Hyprland blur does the heavy lifting) ---
background_opacity 0.88
dynamic_background_opacity yes

# --- Tabs: minimal powerline ---
tab_bar_edge bottom
tab_bar_margin_width 0
tab_bar_margin_height 6 0
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{fmt.fg.tabfg}{fmt.bg.default} {index}: {title} "
active_tab_title_template "{fmt.fg._tabactivefg}{fmt.bg._tabactivebg} {index}: {title} "
tab_fade 0.25
tab_separator " ┇"
tab_activity_symbol "●"

# --- Splits ---
enabled_layouts splits,stack,tall,fat,grid
remember_window_size no
initial_window_width 120c
initial_window_height 32c

# --- Performance ---
repaint_delay 8
input_delay 2
sync_to_monitor yes

# --- Theme ---
include current-theme.conf

# --- QoL keybinds ---
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map kitty_mod+enter new_window
